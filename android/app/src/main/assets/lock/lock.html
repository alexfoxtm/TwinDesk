<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mac login screen</title><link rel="stylesheet" href="lock.css"></head>
<body>
<div id="screen"></div><div id="status" role="status">Connecting…</div>
<form id="auth" hidden autocomplete="off">
<label><span id="username-label"></span><input id="username" name="local-account" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="256" aria-describedby="auth-error" required></label>
<label><span id="password-label"></span><input id="password" name="local-secret" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="256" aria-describedby="auth-error" required></label>
<p id="auth-error" role="alert"></p>
<button id="signin" type="submit"></button>
</form>
<input id="keyboard" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true">
<script type="module" src="lock.js"></script>
</body></html>

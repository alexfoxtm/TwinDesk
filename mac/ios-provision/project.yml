# TwinDesk's provisioning-only project (mac/ios-provision-profiles.js). It holds no TwinDesk code:
# three empty targets with TwinDesk's existing bundle IDs, no capabilities or entitlements, signed
# automatically for the pinned team so Xcode issues fresh team profiles for them. The renewer
# guards the certificate and the profiles around each run. Regenerate the checked-in project with
# `xcodegen generate` after editing this file.
name: TwinDeskProvision
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5H4D7574Z4
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  App:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: Broadcast
        embed: true
      - target: Share
        embed: true
    settings:
      base:
        PRODUCT_NAME: TwinDesk
        PRODUCT_BUNDLE_IDENTIFIER: com.twindesk.ios
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
  Broadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twindesk.ios.broadcast
        INFOPLIST_FILE: Broadcast/Info.plist
        GENERATE_INFOPLIST_FILE: "YES"
        SKIP_INSTALL: "YES"
  Share:
    type: app-extension
    platform: iOS
    sources: [Share]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twindesk.ios.share
        INFOPLIST_FILE: Share/Info.plist
        GENERATE_INFOPLIST_FILE: "YES"
        SKIP_INSTALL: "YES"
